name: Yayın Nöbetçisi (site kontrolü)
on:
  schedule:
    # 2026-10-07: GitHub, tam saatlere yakin zamanlanmis kosulari yuk
    # dagiliminda SESSIZCE DI-SU-RUYOR (bu sabah gunluk raporun 04:05 UTC
    # cronu hic calismadi, nobetcinin 08:00 UTC cronu da). Tek-saat-disi ve
    # sik pencereler: her pencere 4 kontrol; bir kosu duserse sonraki
    # kontrol ~1 saat icinde telafi eder.
    # Hafta ici: 08:23-11:23 TSİ — gunluk rapor (raporlar/<tarih>.html).
    # 12:23-15:23 TSİ — derin analiz (derin-analiz/<tarih>.html). Pazartesi
    # gunleri makro analiz de kontrol edilir (haftalik yayin).
    # 2026-10-31: ogleden sonrasi yedek pencere (16:23 TSİ) — derin analiz
    # + yayin tazeligi; aksam publish slotu dustugunde telafi eder.
    - cron: '23 5,6,7,8 * * 1-5'
    - cron: '23 9,10,11,12 * * 1-5'
    - cron: '23 13 * * 1-5'
    # Hafta sonu: 10:43-16:43 TSİ — hafta sonu gundem (haftasonu.html),
    # borsa okulu (haftasonu-egitimi.html) + yayin akisi/tazeligi
    # (publish.yml). Uretim cronlari: gundem 08:23, egitim 09:47 TSİ; ilk
    # pencere 10:43 telafi payi ~1-2 saat; 7 pencere ~6 saat kapsar.
    - cron: '43 7,8,9,10,11,12,13 * * 6,0'
    # 2026-10-11 (Pazar): yukaridaki 5 hafta sonu penceresinin TAMAMI dustu
    # ve zincir ilk halkasini atamadi — hafta sonu icerigi hic uretilmedi.
    # Erken pencere: 09:43 TSİ, uretim cronlari duserse telafiyi ~1 saat
    # one alir; cift tetikleme zaten 'suruyor/bekliyor' kontrolu + uretici
    # tazelik kapilariyla korunur. Zincir bu kosudan sonra kendini 40 dk'da
    # bir tekrar tetikler.
    - cron: '43 6 * * 6,0'
    # 2026-10-31 (Cumartesi): 6 hafta sonu penceresinin TAMAMI yine dustu,
    # zincir baslayamadi, publish edilmemis icerik ogleden sonraya kaldi.
    # 07:43 TSİ penceresi yuk penceresinin (08-12 UTC) DISINDA — en az bir
    # pencerenin yasama sansini yukseltir.
    - cron: '43 4 * * 6,0'
  workflow_dispatch:
    inputs:
      kontrol:
        description: 'Kontrol edilecek yayın: daily | derin | makro | gundem | egitim | yayin (boş: saate göre)'
        required: false
        default: ''
permissions:
  actions: write
  contents: read
concurrency:
  group: yayin-nobetci
  cancel-in-progress: false
jobs:
  kontrol:
    runs-on: ubuntu-latest
    # Zincir turu kendi icinde 40 sn uyur + kontroller: 50 dk tavan
    timeout-minutes: 50
    steps:
      - name: Kontrol edilecek yayinlari sec
        id: sec
        run: |
          TODAY=$(TZ=Europe/Istanbul date +%F)
          GUN=$(TZ=Europe/Istanbul date +%u)   # 1=Pazartesi ... 7=Pazar
          HEDEF="${{ inputs.kontrol }}"
          if [ -z "$HEDEF" ]; then
            SAAT=$(TZ=Europe/Istanbul date +%H)
            if [ "$GUN" -le 5 ]; then
              # Hafta ici: 08-11 => daily; diger => derin (+ pazartesi makro)
              # + yayin tazeligi (2026-10-31)
              if [ "$SAAT" -ge 8 ] && [ "$SAAT" -le 11 ]; then
                HEDEF="daily"
              else
                HEDEF="derin"
                if [ "$GUN" = "1" ]; then HEDEF="derin makro"; fi
                HEDEF="$HEDEF yayin"
              fi
            else
              # Hafta sonu (cumartesi/pazar): 09-14 => gundem egitim yayin
              # (uretim: gundem 08:23, egitim 09:47; erken pencere 09:43,
              # asil pencereler 10:43-16:43). 15-19 => yalniz yayin tazeligi
              # (icerik ogleden sonra dustuyse aksama kalmadan yayinlansin).
              if [ "$SAAT" -ge 9 ] && [ "$SAAT" -le 14 ]; then
                HEDEF="gundem egitim yayin"
              elif [ "$SAAT" -ge 15 ] && [ "$SAAT" -le 19 ]; then
                HEDEF="yayin"
              else
                # Saat disinda Elle tetikleme disinda YOK
                HEDEF="YOK"
              fi
            fi
          fi
          # Elle tetikleme: daily|derin|makro|gundem|egitim|yayin|YOK
          case " $HEDEF " in
            *" YOK "*) HEDEF="YOK" ;;
          esac
          echo "tarih=$TODAY" >> "$GITHUB_OUTPUT"
          echo "hedefler=$HEDEF" >> "$GITHUB_OUTPUT"
          echo "Kontrol hedefleri: $HEDEF ($TODAY)"

      - name: Yayin varligini denetle (git icerigi + canli site yedek)
        id: yayin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TODAY="${{ steps.sec.outputs.tarih }}"
          EKSIK=""
          for HEDEF in ${{ steps.sec.outputs.hedefler }}; do
            case "$HEDEF" in
              daily) DOSYA="raporlar/${TODAY}.html" ;;
              derin) DOSYA="derin-analiz/${TODAY}.html" ;;
              makro) DOSYA="makro-analiz/${TODAY}.html" ;;
              gundem) DOSYA="haftasonu/${TODAY}.html" ;;
              egitim) DOSYA="haftasonu-egitimi/${TODAY}.html" ;;
              yayin)
                # yayin hedefi (2026-10-31 genisletildi):
                # (a) TAZELIK: main'in HEAD'i bir yayin commit'i DEGILSE
                #     depoda yayinlanmayi bekleyen icerik vardir; icerik
                #     ~90 dk'dir duruyor VE son yayından beri ~3 saat gecti ise
                #     publish tetiklenir. 3 saatlik sinir CF build butcesini
                #     sinirlar (en kotu ~8 yayin/gun); 90 dk'lik sinir hala
                #     kosan ureticiyle yarisi engeller.
                # (b) HAFTA SONU dosya kontrolu: gundem/egitim sayfalari
                #     git'te varken canli sitede yoksa publish tetiklenir.
                YAYIN_EKSIK=0
                BASLIK=$(gh api "repos/${REPO}/commits?per_page=1" --jq '.[0].commit.message' | head -n1)
                case "$BASLIK" in
                  "Site yayini"*) echo "Tazelik: son commit yayin commit'i — deploy taze." ;;
                  *)
                    SIMDI=$(date +%s)
                    HEAD_ZAMAN=$(gh api "repos/${REPO}/commits?per_page=1" --jq '.[0].commit.committer.date')
                    HEAD_YAS=$(( SIMDI - $(date -d "$HEAD_ZAMAN" +%s) ))
                    SON_YAYIN=$(gh api "repos/${REPO}/commits?per_page=30" --jq '[.[] | select(.commit.message | startswith("Site yayini")) | .commit.committer.date] | .[0] // empty')
                    if [ -n "$SON_YAYIN" ]; then
                      YAYIN_YAS=$(( SIMDI - $(date -d "$SON_YAYIN" +%s) ))
                    else
                      YAYIN_YAS=999999
                    fi
                    echo "Tazelik: HEAD yasi ${HEAD_YAS}s, son yayin yasi ${YAYIN_YAS}s"
                    if [ "$HEAD_YAS" -gt 5400 ] && [ "$YAYIN_YAS" -gt 10800 ]; then
                      echo "EKSIK: yayin (depoda yayinlanmayi bekleyen icerik birikiyor)"
                      YAYIN_EKSIK=1
                    fi
                    ;;
                esac
                # hafta sonu dosya kontrolu (gundem/egitim canlilik kontrolu)
                if [ "$(TZ=Europe/Istanbul date +%u)" -ge 6 ]; then
                  for PUB_DOSYA in "haftasonu/${TODAY}.html" "haftasonu-egitimi/${TODAY}.html"; do
                    # once git'te var mi? CIKIS KODUYLA denetlenir: gh api 404
                    # govdesini stdout'a bastigi icin eski "Not Found" mesaj
                    # karsilastirmasi hic yakalamiyor, nobetci "mevcut" sanip
                    # ureticiyi tetiklemiyordu (2026-10-23 derin analizi kacti).
                    if ! gh api "repos/${REPO}/contents/${PUB_DOSYA}?ref=main" --jq .git_url >/dev/null 2>&1; then
                      echo "EKSIK (git): ${PUB_DOSYA} — henuz commit edilmemis"
                      YAYIN_EKSIK=1
                      continue
                    fi
                    # git'te varsa canli site kontrol
                    KOD=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 \
                          "https://borsa-raporlari.pages.dev/${PUB_DOSYA}?nobetci=${TODAY}-pub")
                    echo "Canli kontrol: ${PUB_DOSYA} -> HTTP ${KOD}"
                    case "$KOD" in 2*) ;; *) YAYIN_EKSIK=1 ;; esac
                  done
                fi
                if [ "$YAYIN_EKSIK" -eq 1 ]; then
                  EKSIK="$EKSIK yayin"
                fi
                continue
                ;;
              *) echo "Bilinmeyen hedef: $HEDEF"; continue ;;
            esac

            # Hafta ici hedefleri: git icerigi kontrolu (hizli, deploy gecikmesinden
            # bagimsiz). CIKIS KODUYLA denetlenir — gh api 404 govdesini stdout'a
            # bastigi icin eski mesaj karsilastirmasi hic yakalamiyordu (2026-10-23).
            if ! gh api "repos/${REPO}/contents/${DOSYA}?ref=main" --jq .git_url >/dev/null 2>&1; then
              echo "EKSIK (git): ${DOSYA} — henuz commit edilmemis"
              EKSIK="$EKSIK $HEDEF"
              continue
            fi
            # git'te varsa canli site yedek kontrol (opsiyonel)
            KOD=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 \
                  "https://borsa-raporlari.pages.dev/${DOSYA}?nobetci=${TODAY}-live")
            echo "Canli yedek: ${DOSYA} -> HTTP ${KOD}"
            case "$KOD" in 2*) ;; *) echo "UYARI: git'te var ama canli degil";; esac
          done
          if [ -z "$EKSIK" ]; then
            echo "Tum hedef yayinlar git'te mevcut."
          fi
          echo "eksik=${EKSIK# }" >> "$GITHUB_OUTPUT"

      - name: Eksik yayinlari ureten is akisini tetikle
        if: steps.yayin.outputs.eksik != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EKSIK: ${{ steps.yayin.outputs.eksik }}
        run: |
          for HEDEF in $EKSIK; do
            case "$HEDEF" in
              daily) WF="daily.yml" ;;
              derin) WF="derin-analiz.yml" ;;
              makro) WF="makro-analiz.yml" ;;
              gundem) WF="haftasonu-gundem.yml" ;;
              egitim) WF="haftasonu-egitim.yml" ;;
              yayin) WF="publish.yml" ;;
              *) echo "Bilinmeyen hedef: $HEDEF"; continue ;;
            esac
            # in_progress VE queued kosulari kontrol et (cift tetikleme onleme)
            SURAN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow="$WF" \
                    --status in_progress --json databaseId --jq 'length')
            BEKLIYEN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow="$WF" \
                    --status queued --json databaseId --jq 'length')
            if [ "${SURAN:-0}" -gt 0 ] || [ "${BEKLIYEN:-0}" -gt 0 ]; then
              echo "$WF zaten suruyor/bekliyor (in_progress=${SURAN:-0}, queued=${BEKLIYEN:-0}) — tekrar tetiklenmedi."
              continue
            fi
            gh workflow run "$WF" --repo "$GITHUB_REPOSITORY" --ref main
            echo "$WF tetiklendi ($HEDEF yayini eksikti)."
          done
      # 2026-10-07: GitHub, 08:00-12:00 UTC yuk penceresinde zamanlanmis
      # (schedule) kosulari gun boyu SESSIZCE dusuruyor (bugun gunluk rapor,
      # nobetci ve derin analiz cronlarinin hicbiri calismadi; ayni dakika
      # dilimindeki workflow_dispatch'lar ise %100 calisti). Bu adim her tur
      # sonunda 40 dk sonra bir sonraki turu KENDI tetikler: zincir bir kez
      # basladigi gun 20:00 TSİ'ye kadar kesintisiz devam eder (aksam
      # publish slotu 19:43 dustugunde tazelik kontroluyle telafi eder).
      - name: Zincir — 40 dk sonra sonraki turu tetikle (schedule dusmelerine karsi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SAAT=$(TZ=Europe/Istanbul date +%H)
          # 2026-10-31: hafta ici 16:00 / hafta sonu 18:00 siniri 20:00'ye
          # uzatildi — aksam yayini (19:43) dustugunde zincir tazesigiyle
          # yakalarsa icerik geceye birakilmaz.
          if [ "$SAAT" -ge 20 ]; then
            echo "Zincir durduruldu (TSI $SAAT:00 sonrasi)."
            exit 0
          fi
          echo "Sonraki kontrol 40 dk sonra (simdi TSI $SAAT)."
          sleep 2400
          gh workflow run yayin-nobetci.yml --repo "$GITHUB_REPOSITORY" --ref main             && echo "Sonraki nobetci turu tetiklendi."

