name: I18N Saglayici Yoklamasi
# Hangi ceviri saglayicisi su an calisiyor, ne kadar sure veriyor, gelen ceviri
# kalite kontrolunden geciyor mu? Tek komut, hepsini olcer.
#
# Bu is hicbir dosyaya YAZMAZ, onbellek kullanmaz, siteye dokunmaz.
# Gercek ceviri i18n.yml'de yapilir.
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Saglayici, kalite ve hiz olcumu
        env:
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          AMD_MODELS: "DeepSeek-V4-Flash,DeepSeek-V4-Flash-Vision-Exp,Qwen3.8-Flash-Next,GLM-5.3-Flash"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA2_API_KEY: ${{ secrets.NVIDIA2_API_KEY }}
          NVIDIA_MODELS: "nvidia/nemotron-3-ultra-550b-a55b,nvidia/nemotron-3-super-120b-a12b,z-ai/glm-5.3,z-ai/glm-5.3-flash"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
          GEM_MODELS: "gemini-3.8-flash"
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER2_API_KEY: ${{ secrets.OPENROUTER2_API_KEY }}
          OR_MODELS: "nvidia/nemotron-3-ultra-550b-a55b:free"
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          ORCAROUTER2_API_KEY: ${{ secrets.ORCAROUTER2_API_KEY }}
          ORCA_MODELS: "deepseek/deepseek-v4-flash-free,tencent/hy4-preview-free"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ2_API_KEY: ${{ secrets.GROQ2_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL2_API_KEY: ${{ secrets.DEEPL2_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODELS: "space-bunny-free,ling-3.1-flash-free,cat-jam-free"
        run: |
          python -m pip install --quiet json-repair
          python -u i18n.py --saglayici-test
          echo ""
          echo "::group::Ceviri kalitesi + DeepL kotasi"
          python -u i18n_kalite_testi.py
          echo "::endgroup::"
          echo "::group::NVIDIA model hiz probu"
          python -u nvidia_hiz_testi.py || echo "::warning::tamamlanamadi"
          echo "::endgroup::"