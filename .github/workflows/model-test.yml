name: Saglayici Model Listesi (gecici)

# Kotasiz: her saglayicidan erisilebilir model listesini ister, her modele TEK istek atar.
# Ceviri kosusundan bagimsiz (concurrency grubu yok).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listele:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Saglayici testi + model listesi
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
          ZAI_MODELS: "glm-4.5-flash,glm-4.7-flash"
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEM_MODELS: "gemini-3.8-flash"
          AMD_MODEL: "DeepSeek-V4-Flash"
          AMD_FALLBACK_MODELS: "GLM-5.3-Flash,Qwen3.8-Flash-Next,MiMo-V2.6-Flash,DeepSeek-V4.1-Flash"
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OR_MODELS: "nvidia/nemotron-3-ultra-550b-a55b:free"
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          ORCA_MODELS: "tencent/hy4-preview-free,z-ai/glm-5.3-flash-free,deepseek/deepseek-v4-flash-free"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODELS: "space-bunny-free"
          DISCOVERY_API_KEY: ${{ secrets.DISCOVERY_API_KEY }}
          TOKENPLAN_API_KEY: ${{ secrets.TOKENPLAN_API_KEY }}
        run: python i18n.py --saglayici-test
