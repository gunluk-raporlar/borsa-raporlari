name: EVDS Ucu Denetimi 2
# Gecici: (1) gercek dolu degerin JSON bicimini, (2) pin'li 3 serinin
# veri+meta yanitini, (3) 4 basarisiz hedef icin kesif adaylarini ogrenir.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: EVDS 2. denetim
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error

          K = os.environ.get("EVDS_API_KEY", "")
          KOK = "https://evds3.tcmb.gov.tr/igmevdsms-dis/"

          def istek(yol, kes=None):
              req = urllib.request.Request(KOK + yol, headers={"key": K})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      govde = r.read()
                      return r.status, (govde if kes is None else govde[:kes])
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:kes]
              except Exception as e:
                  return None, str(e).encode()

          def satir(etiket, durum, govde):
              metin = govde.decode("utf-8", "replace").replace("\n", " ")
              print(f"{etiket} | {durum} | {metin[:500]}")

          # 1) DOLU DEGER GORUNTUSU: isgunu araligi, ham (frekans/formul yok)
          s, g = istek("series=TP.DK.USD.A&startDate=01-09-2026"
                       "&endDate=23-09-2026&type=json", kes=700)
          satir("USD-HAM-JSON", s, g)
          s, g = istek("series=TP.DK.USD.A&startDate=01-09-2026"
                       "&endDate=23-09-2026&type=csv", kes=400)
          satir("USD-HAM-CSV", s, g)

          # 2) PIN'LI 3 SERI: _veri_cek ile ayni parametreler + ham + meta
          pinler = [("TP.FKF.TRY.15", 0), ("TP.KM.B23", 3), ("TP.HPBITABLO1.18", 3)]
          for kod, form in pinler:
              s, g = istek(f"series={kod}&startDate=21-08-2025"
                           f"&endDate=24-09-2026&type=json"
                           f"&frequency=5&formulas={form}&aggregationTypes=")
              satir(f"PIN-{kod}", s, g)
              s, g = istek(f"series={kod}&startDate=01-06-2025"
                           f"&endDate=24-09-2026&type=json")
              satir(f"HAM-{kod}", s, g)
              s, g = istek(f"serieList/type=json&code={kod}")
              satir(f"META-{kod}", s, g)

          # 3) KESIF ADAYLARI: tum gruplar (taze ilk) + hedefe uygun seriler
          s, g = istek("datagroups/mode=0&code=&type=json")
          gruplar = json.loads(g) if s == 200 else []
          print("GRUP-SAYISI:", len(gruplar) if isinstance(gruplar, list) else s)

          def duz(t):
              s = str(t or "").casefold()
              for a, b in (("ı","i"),("i̇","i"),("ş","s"),("ğ","g"),("ü","u"),
                           ("ö","o"),("ç","c"),("â","a"),("î","i"),("û","u")):
                  s = s.replace(a, b)
              return s

          hedefler = {
              "deposit_rate":  (r"faiz|interest|rate", r"mevduat|deposit", r"faiz|interest|rate"),
              "reer":          (r"endeks|doviz|kurlar|index|exchange", r"reel efektif|real effective|reer", r"reel|real"),
              "tr2y":          (r"tahvil|getiri|borclanma|bond|yield|treasury|devlet", r"2\s*yil|2\s*year", r"2"),
              "tr10y":         (r"tahvil|getiri|borclanma|bond|yield|treasury|devlet", r"10\s*yil|10\s*year", r"10"),
          }
          for hedef, (gdes, sdes, ek) in hedefler.items():
              aday = [gr for gr in gruplar
                      if isinstance(gr, dict) and re.search(
                          gdes, duz(gr.get("DATAGROUP_NAME")) + " " + duz(gr.get("DATAGROUP_NAME_ENG")))]
              aday.sort(key=lambda gr: str(gr.get("END_DATE") or ""), reverse=True)
              print(f"--- {hedef}: {len(aday)} grup")
              for gr in aday[:10]:
                  print("   GRUP:", gr.get("DATAGROUP_CODE"), "|",
                        str(gr.get("DATAGROUP_NAME") or "")[:70], "| END:",
                        gr.get("END_DATE"), "| FREQ:", gr.get("FREQUENCY"))
              for gr in aday[:6]:
                  s2, g2 = istek(f"serieList/type=json&code={gr.get('DATAGROUP_CODE')}")
                  if s2 != 200:
                      continue
                  seriler = json.loads(g2)
                  bulunan = [se for se in seriler if isinstance(se, dict) and (
                      re.search(sdes, duz(se.get("SERIE_NAME")) + " " + duz(se.get("SERIE_NAME_ENG")))
                      or re.search(ek, duz(se.get("SERIE_NAME")) + " " + duz(se.get("SERIE_NAME_ENG"))))]
                  for se in bulunan[:6]:
                      print("   SERI:", se.get("SERIE_CODE"), "|",
                            str(se.get("SERIE_NAME") or se.get("SERIE_NAME_ENG"))[:75],
                            "| END:", se.get("END_DATE"), "| FREQ:", se.get("FREQUENCY_STR"))
          PY
