name: Makro Snapshot Nöbetçisi
on:
  schedule:
    # 05:00 Türkiye saati (02:00 UTC): 18:05 akşam koşusunu GitHub hiç
    # ateşlemediyse dünün snapshot'i eksik kalır. Nöbetçi eksikse snapshot'i
    # tetikler; yakalama koşusu ~05:02'de başlayıp normalizasyon penceresine
    # (00:00-05:59) takılmadan önceki günün akşamına yazılır — veri günü
    # karışması olmaz. ~05:10'da biter; 07:05'teki günlük rapordan ~2 saat
    # önce taze arşiv hazır olur. 06:00'tan sonra tetiklemek YANLIŞ olurdu:
    # pencere kapanır ve kapı koşuyu reddederdi.
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: makro-nobetci
  cancel-in-progress: false
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Dünün akşam snapshot'i var mi?
        id: kontrol
        run: |
          DUN=$(date -d "yesterday" +%F)
          if [ -f "data/makro-gecmis/${DUN}.json" ]; then
            echo "Snapshot mevcut: data/makro-gecmis/${DUN}.json — islem yok."
            echo "eksik=false" >> "$GITHUB_OUTPUT"
          else
            echo "Snapshot EKSIK: data/makro-gecmis/${DUN}.json — tetiklenecek."
            echo "eksik=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Snapshot'i tetikle
        if: steps.kontrol.outputs.eksik == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run makro-snapshot.yml --ref main
          echo "makro-snapshot dispatch edildi (yakalama koşusu)."
