name: Borsa Okulu (Hafta Sonu Dersi)
on:
  schedule:
    # Cumartesi + Pazar 10:30 Turkiye saati (07:30 UTC) — gundemden 1,5 saat sonra (model yuku ayrissin)
    - cron: '30 7 * * 6,0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  egitim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Borsa okulu dersini uret
        env:
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          ALT_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
        run: python -u egitim.py
      - name: Degisiklikleri yayinla
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok; commit atlanır."
            exit 0
          fi
          git commit -m "Borsa okulu dersi guncellemesi"
          git pull --rebase -X theirs origin main
          git push origin main
