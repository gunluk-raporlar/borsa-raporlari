name: Borsa Okulu (Hafta Sonu Dersi)
on:
  schedule:
    # Cumartesi + Pazar 09:47 Turkiye saati (06:47 UTC) — gundemden ~1,5 saat
    # sonra (model yuku ayrissin). 2026-10-10: eski cron (07:30 UTC, dakika 30)
    # GitHub yuk dagiliminda SESSIZCE dustu; tek-saat-disi dakikaya tasindi,
    # duserse yayin-nobetci telafi eder.
    # 2026-10-11 (Pazar): 06:47 cronu da dustu; yuk-disi yedek pencere eklendi.
    - cron: '47 6 * * 6,0'
    - cron: '11 4 * * 6,0'   # 07:11 TSİ yuk-disi yedek pencere
  workflow_dispatch:
    inputs:
      force:
        description: 'Bugunun dersi varsa bile yeniden uret'
        type: boolean
        default: false
permissions:
  actions: write
  contents: write
concurrency:
  group: haftasonu-egitim
  cancel-in-progress: false
jobs:
  egitim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      # Tazelik kapisi (2026-10-11): coklu cron/dispatch yollarindan ikinci
      # bir kosu ayni gunun dersini LLM ile yeniden uretmesin; force=true
      # ile elle zorlanabilir (daily.yml'deki ayni desen).
      - name: Tazelik kapisi
        id: kapisi
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "FORCE — uretim zorlandi."
            echo "uretim=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BUGUN=$(TZ=Europe/Istanbul date +%F)
          if [ -f "haftasonu-egitimi/${BUGUN}.html" ]; then
            echo "Bugunun dersi zaten yayinda (${BUGUN}) — uretim atlandi."
            echo "uretim=false" >> "$GITHUB_OUTPUT"
          else
            echo "uretim=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Borsa okulu dersini uret
        if: steps.kapisi.outputs.uretim != 'false'
        env:
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ALT_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
        run: python -u egitim.py
      - name: Degisiklikleri yayinla
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok; commit atlanır."
            exit 0
          fi
          git commit -m "Borsa okulu dersi guncellemesi [CI Skip]"
          git pull --rebase -X theirs origin main
          git push origin main
