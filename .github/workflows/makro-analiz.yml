name: Makro Analiz (GLM + DeepSeek yedek)
on:
  # Ana kosu: Pazartesi TSİ 07:00 (onceki aksam snapshot'i uzerine uretilir).
  # Guvenlik kosulari (Sali-Cuma TSİ 08:00, 2026-10-06): Pazartesi uretimi
  # basarisizsa hafta ortasinda kendini onarir; makro_analiz.py'deki 48 saat
  # tazelik kapisi taze sayfada gereksiz uretimi 1 dakikada keser. Son care
  # yayini (uyari rozetli) ile "haftalarca bayat sayfa" senaryosu kapanmistir.
  schedule:
    - cron: '0 4 * * 1'
    - cron: '0 5 * * 2-5'
  workflow_dispatch:
    inputs:
      storm:
        description: 'STORM modu: oz prompt (daha az sayi = daha az uydurma alani)'
        required: false
        default: 'false'
      force:
        description: '48 saat tazelik kapisini atla (MAKRO_FORCE=1, yeniden uretim)'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  # Zamanlanmis kosu ile yayin-nobetci/manual dispatch cakismasin: ikinci
  # kosu sırada bekler (3 denemelik uretim 3 saati buldugundan kesmek
  # yerine kuyruklamak guvenli).
  group: makro-analiz
  cancel-in-progress: false
jobs:
  analiz:
    runs-on: ubuntu-latest
    # "Uretene kadar denesin" (kullanici karari, 2026-10-01): 3 deneme x
    # ~50 dk + aralarda 2x10 dk bekleme ~170 dk edebilir; 180 dk sinir.
    # Denemeler arasindaki beklemeler gecici saglayici kesintilerinin
    # (orn. AMD gunluk timeout'lari) selfServle duzelmesine izin verir.
    timeout-minutes: 180
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Makro analizi uret
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
          # Uzun analitik yanitlar 240 sn istek zaman asimina takilmasin
          LLM_TIMEOUT: "420"
          ZAI_MODEL: ${{ vars.ZAI_MODEL }}
          # Yedek: GLM alinamazsa AMD DeepSeek-V4-Flash ile uretilir
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Son-care rotasyonunun OpenRouter/Groq havuzlari da gercekten
          # calisabilmesi icin bu iki anahtar da verilmeli (2026-09-29:
          # NVIDIA havuzu 6 denemeyi de yiyip OR/Groq'a sira gelmedi).
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALT_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AMD_MODEL: "DeepSeek-V4-Flash"
          GOOGLE_SITE_DOGRULAMA: ${{ secrets.GOOGLE_SITE_DOGRULAMA }}
          BING_SITE_DOGRULAMA: ${{ secrets.BING_SITE_DOGRULAMA }}
          BAIDU_SITE_DOGRULAMA: ${{ secrets.BAIDU_SITE_DOGRULAMA }}
          YANDEX_SITE_DOGRULAMA: ${{ secrets.YANDEX_SITE_DOGRULAMA }}
        run: |
          # STORM modu: 2./3. denemelerde prompt ozlesir (kisa cikti = daha az
          # uydurma alani). Elle tetiklemede -f storm=true ile 1. denemeden zorlanir.
          if [ "${{ inputs.storm }}" = "true" ]; then
            export STORM=1
          fi
          # Elle yeniden uretim: 48 saat tazelik kapisini atla (2026-10-07).
          if [ "${{ inputs.force }}" = "true" ]; then
            export MAKRO_FORCE=1
          fi
          for deneme in 1 2 3; do
            if [ "$deneme" -ge 2 ]; then
              export STORM=1
            fi
            echo "=== Makro analiz denemesi: $deneme/3 (STORM=${STORM:-0}) ==="
            if python -u makro_analiz.py; then
              echo "Basarili (deneme $deneme)."
              exit 0
            fi
            echo "Deneme $deneme basarisiz."
            if [ "$deneme" -lt 3 ]; then
              echo "5 dakika beklenip tekrar denenecek (son care yayini sayesinde tam basarisizlik bile rozetli cikti uretir)..."
              sleep 300
            fi
          done
          echo "3 denemenin hepsi basarisiz."
          exit 1
      - name: Degisiklikleri yayinla
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok; commit atlanır."
            exit 0
          fi
          git commit -m "Makroekonomik degerlendirme guncellemesi [CI Skip]"
          git pull --rebase -X theirs origin main
          git push origin main
          # [CI Skip] commit build tetiklemedigi icin site aksam 19:43'e
          # kadar eski kalirdi; yayin commit'i Cloudflare Pages build'ini
          # hemen tetikler.
          git commit --allow-empty -m "Site yayini (makro)"
          git pull --rebase -X theirs origin main
          git push origin main
