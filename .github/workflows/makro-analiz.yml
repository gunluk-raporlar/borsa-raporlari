name: Makro Analiz (GLM + DeepSeek yedek)
on:
  # 20:30 TSİ akşam snapshot'ı; Pazartesi 07:00 TSİ makro analizi bu kaydı okur.
  schedule:
    - cron: '0 4 * * 1'
    # Pazartesi koşusu başarısızsa sayfa bir hafta bayat kalıyordu
    # (2026-09-28: 35 dk timeout ile iptal oldu, sayfa 25'inde kaldı).
    # Salı-Cuma güvenlik tekrarı: sayfa tazeyse (dün veya bugün üretilmişse)
    # aşağıdaki koruma adımı üretimi atlar, maliyet oluşmaz.
    - cron: '30 4 * * 2-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analiz:
    runs-on: ubuntu-latest
    # Sağlayıcılar yavaşsa AMD rotasyonu + GLM + AMD yedeği toplam ~50 dk
    # sürebiliyor; 35 dk koşuyu çağrı ortasında iptal ettiriyordu.
    timeout-minutes: 55
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Sayfa bu haftanin mi? (Pazartesi uretildiyse tekrarlama)
        # Yalnizca Salı-Cuma güvenlik cron'larında çalışır; manuel ve
        # Pazartesi koşuları her zaman üretir.
        # Kapı haftanin Pazartesi'sine baglidir; "dun"e degil (2026-10-01:
        # Salideki atlama sonrasi sayfa Pazartesi tarihli kalinca Carsamba
        # "dunden eski" sayip 42 dk'lik gereksiz uretim baslatti).
        if: github.event_name == 'schedule' && github.event.schedule == '30 4 * * 2-5'
        run: |
          SON=$(grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' makro-analiz.html 2>/dev/null | head -1 || true)
          PZRT=$(TZ=Europe/Istanbul date -d 'last monday' +%F)
          echo "Sayfadaki son tarih: ${SON:-yok} • bu haftanin Pazartesi'si: $PZRT"
          if [ -n "$SON" ] && { [ "$SON" \> "$PZRT" ] || [ "$SON" = "$PZRT" ]; }; then
            echo "Makro analiz bu haftanin sürümü; yeniden üretilmiyor."
            echo "taze=true" >> "$GITHUB_ENV"
          fi
      - name: Python kur
        if: env.taze != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kutuphaneleri kur
        if: env.taze != 'true'
        run: pip install -r requirements.txt
      - name: Makro analizi uret
        if: env.taze != 'true'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL }}
          # Yedek: GLM alinamazsa AMD DeepSeek-V4-Flash ile uretilir
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Son-care rotasyonunun OpenRouter/Groq havuzlari da gercekten
          # calisabilmesi icin bu iki anahtar da verilmeli (2026-09-29:
          # NVIDIA havuzu 6 denemeyi de yiyip OR/Groq'a sira gelmedi).
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALT_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AMD_MODEL: "DeepSeek-V4-Flash"
          GOOGLE_SITE_DOGRULAMA: ${{ secrets.GOOGLE_SITE_DOGRULAMA }}
          BING_SITE_DOGRULAMA: ${{ secrets.BING_SITE_DOGRULAMA }}
          BAIDU_SITE_DOGRULAMA: ${{ secrets.BAIDU_SITE_DOGRULAMA }}
          YANDEX_SITE_DOGRULAMA: ${{ secrets.YANDEX_SITE_DOGRULAMA }}
        run: python -u makro_analiz.py
      - name: Degisiklikleri yayinla
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok; commit atlanır."
            exit 0
          fi
          git commit -m "Makroekonomik degerlendirme guncellemesi [CI Skip]"
          git pull --rebase -X theirs origin main
          git push origin main
          # [CI Skip] commit build tetiklemedigi icin site aksam 19:43'e
          # kadar eski kalirdi; yayin commit'i Cloudflare Pages build'ini
          # hemen tetikler.
          git commit --allow-empty -m "Site yayini (makro)"
          git pull --rebase -X theirs origin main
          git push origin main
