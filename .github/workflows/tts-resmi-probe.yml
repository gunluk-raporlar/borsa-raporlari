name: Qwen3 Resmi Tarife Yoklamasi (gecici)
# Demo Space'in app.py'inde bulunan resmi uretim tarifiyle yeniden test
# (2026-10-07): ornekleme ayarlari + İ->i normalizasyonu + non_streaming
# + cumle-basina seed + Space'in hazir sesleri (voice-01/02).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: torch + torchaudio (CPU) kur
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: qwen-tts kur
        run: pip install "qwen-tts==0.1.1" soundfile
      - name: Resmi tarife yoklama
        run: python -u tts_resmi_probe.py
      - name: Ornekleri repoya isle
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add radyo/deneme
          if ! git diff --cached --quiet; then
            git commit -m "Qwen3 resmi tarife ornekleri [CI Skip]"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
      - name: Artifact yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-resmi
          path: radyo/deneme
