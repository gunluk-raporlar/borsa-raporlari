name: TTS Adil Kiyas Yoklamasi (gecici)
# Kullanici itirazi (2026-10-07): "sayfadaki ornekler baya iyi Turkce
# konusuyordu" — ilk Qwen3 testimiz sentetik EMA referansiyla klonlama
# yolunu kullanmisti. Bu kosu: (A) Qwen3 gercek-kalite referansla,
# (B) Trendyol-TTS CPU hiz olcumu.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: torch + torchaudio (CPU) kur
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Modelleri kur
        run: pip install "qwen-tts==0.1.1" soundfile edge-tts "voxcpm==2.0.3"
      - name: Kiyas yoklamasi
        run: python -u tts_kiyas_probe.py
      - name: Ornekleri repoya isle
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add radyo/deneme
          if ! git diff --cached --quiet; then
            git commit -m "TTS adil kiyas ornekleri [CI Skip]"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
      - name: Artifact yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-kiyas
          path: radyo/deneme
