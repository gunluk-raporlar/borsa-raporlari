name: Hafta Sonu Gundem Ajani
on:
  schedule:
    # Cumartesi + Pazar 08:23 Turkiye saati (05:23 UTC). 2026-10-10: eski
    # tam-saat cronu (06:00 UTC) GitHub yuk dagiliminda SESSIZCE dustu;
    # tek-saat-disi dakikaya tasindi, duserse yayin-nobetci telafi eder.
    - cron: '23 5 * * 6,0'
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: haftasonu-gundem
  cancel-in-progress: false
jobs:
  gundem:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Gundemi uret
        env:
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ALT_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
        run: python -u haftasonu.py
      - name: Degisiklikleri yayinla
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok; commit atlanır."
            exit 0
          fi
          git commit -m "Hafta sonu gundemi guncellemesi [CI Skip]"
          git pull --rebase -X theirs origin main
          git push origin main
