name: Gunluk BIST 30 Raporu

on:
  schedule:
    - cron: '0 5 * * *'   # 08:00 Türkiye saati (UTC+3) = 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Botu calistir
        env:
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
        run: python -u bot.py

      - name: Degisiklikleri depoya geri kaydet
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Gunluk rapor ve portfoy guncellemesi"
          git push origin main

      - name: Netlify'a yayinla
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy --prod --dir=. --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
