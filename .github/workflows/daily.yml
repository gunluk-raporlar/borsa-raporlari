name: Gunluk BIST 30 Raporu
on:
  schedule:
    - cron: '0 5 * * *'   # 08:00 Türkiye saati (UTC+3) = 05:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Botu calistir
        env:
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          ALT_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          for deneme in 1 2 3; do
            echo "=== Bot calistirma denemesi: $deneme/3 ==="
            if python -u bot.py; then
              echo "Basarili (deneme $deneme)."
              exit 0
            fi
            echo "Bu deneme basarisiz oldu."
            if [ "$deneme" -lt 3 ]; then
              echo "5 dakika beklenip tekrar denenecek..."
              sleep 300
            fi
          done
          echo "3 denemenin hepsi basarisiz oldu."
          exit 1
      - name: Degisiklikleri depoya geri kaydet
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Gunluk rapor ve portfoy guncellemesi"
          git push origin main
      - name: Netlify'a yayinla
        continue-on-error: true   # Netlify erisimi koparsa is bozuk rapor yerine hatayla bitmesin; rapor zaten repoya commitlenmistir
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy --prod --dir=. --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
