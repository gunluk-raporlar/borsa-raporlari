name: Gunluk BIST 30 Raporu
on:
  schedule:
    # Hafta ici 07:05 TSi (04:05 UTC) — kosu ~50 dk surup ~08:00'te biter;
    # workflow_run yayiniyla site ~08:05'te guncellenir (sitedeki '08:00'e kadar'
    # ibaresiyle uyumlu). 10:00 borsa acilisindan 2+ saat once, hata durumunda
    # da retry alani genis. 04:05 secildi ki cift saatlerde kosan i18n ile
    # ayni anda baslamasin. Hafta sonu piyasa kapali — uretim yok.
    - cron: '17 4 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bugunun raporu varsa bile yeniden uret'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  # Zamanlanmis kosu ile yayin-nobetci/manual dispatch cakismasin: ikinci
  # kosu sırada bekler (uretim uzun surdugunden kesmek yerine kuyruklamak
  # guvenli).
  group: gunluk-rapor
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      # Tazelik kapisi (2026-10-09): gecikmis GitHub cron'lari ayni gunun
      # raporunu IKINCI kez uretip eziyordu (8 Ekim: derin analiz 2 kez
      # uretildi). Bugunun dosyasi varsa uretim atlanir; force=true ile
      # elle zorlanabilir (makro'daki MAKRO_FORCE deseninin aynisi).
      - name: Tazelik kapisi
        id: kapisi
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "FORCE — uretim zorlandi."
            echo "uretim=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BUGUN=$(TZ=Europe/Istanbul date +%F)
          if [ -f "raporlar/${BUGUN}.html" ]; then
            echo "Bugunun raporu zaten yayinda (${BUGUN}) — uretim atlandi."
            echo "uretim=false" >> "$GITHUB_OUTPUT"
          else
            echo "uretim=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Botu calistir
        if: steps.kapisi.outputs.uretim != 'false'
        env:
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ALT_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
          GOOGLE_SITE_DOGRULAMA: ${{ secrets.GOOGLE_SITE_DOGRULAMA }}
          BING_SITE_DOGRULAMA: ${{ secrets.BING_SITE_DOGRULAMA }}
          BAIDU_SITE_DOGRULAMA: ${{ secrets.BAIDU_SITE_DOGRULAMA }}
          YANDEX_SITE_DOGRULAMA: ${{ secrets.YANDEX_SITE_DOGRULAMA }}
        run: |
          for deneme in 1 2 3; do
            echo "=== Bot calistirma denemesi: $deneme/3 ==="
            if python -u bot.py; then
              echo "Basarili (deneme $deneme)."
              exit 0
            fi
            echo "Bu deneme basarisiz oldu."
            if [ "$deneme" -lt 3 ]; then
              echo "5 dakika beklenip tekrar denenecek..."
              sleep 300
            fi
          done
          echo "3 denemenin hepsi basarisiz oldu."
          exit 1
      - name: Degisiklikleri depoya geri kaydet
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Gunluk rapor ve portfoy guncellemesi [CI Skip]"
          # Insan veya diger isler araya commit atarsa (fetch first) cakismasin:
          git pull --rebase -X theirs origin main
          git push origin main
      - name: Hata bildirimi (is akisi basarisiz olursa)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASLIK="Gunluk bot basarisiz: $(date -u +%Y-%m-%d)"
          VAR=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$BASLIK" --json title -q '.[].title' 2>/dev/null | grep -cF "$BASLIK" || true)
          if [ "$VAR" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$BASLIK" \
              --body "Gunluk BIST 30 uretimi basarisiz oldu. Kosu kaydi: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # Not: Netlify yayini kaldirildi (kota doldu); site Cloudflare Pages uzerinden
      # yayinlanmaya devam eder. Yeni Next.js arayuzu ayri olarak 'Web (Next.js) Deploy'
      # workflow'u ile borsa-raporlari-web.pages.dev adresine gider.

      # Kullanim defterini private ops deposuna senkronla (2026-10-08).
      # OPS_REPO_TOKEN secret'i yokken betik sessizce atlar.
      - name: Kullanim defterini ops deposuna senkronla
        env:
          OPS_REPO_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
        run: python -u ops_sync.py || echo "::warning::Ops defter senkronu basarisiz — rapor yayini etkilenmez."
