name: Cok Dilli Sayfa Guncelleme

# Ceviri ayri bir kosuda yapilir; gunluk rapor kosusu ceviri yuzunden uzamaz/iptal olmaz.
# AMD: RPM limiti 20/dk -> istekler arasi 3.5 sn. Buyuk model kapasite doluysa yedege devreder.

on:
  schedule:
    - cron: "0 */2 * * *"   # 2 saatte bir: ceviri kuyrugu kendiliginden ilerler
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      provider:
        description: "Ceviri saglayici (llm | deepl)"
        type: choice
        options:
          - llm
          - deepl
        default: llm
      test:
        description: "Sadece saglayici testi calistir (ceviri yapmaz)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # nobetci zincirini gun ici uyandirmak icin (2026-10-07)

concurrency:
  group: i18n
  cancel-in-progress: false

jobs:
  cevir:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bozuk JSON kurtarici (istege bagli)
        continue-on-error: true
        run: python -m pip install --quiet json-repair

      - name: Saglayici testi (kotasiz)
        if: ${{ inputs.test }}
        env:
          # Z.AI (GLM) â€” kullanicinin kayitli anahtari; ceviride birincil
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: "glm-5.3-flash"
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA2_API_KEY: ${{ secrets.NVIDIA2_API_KEY }}
          NVIDIA3_API_KEY: ${{ secrets.NVIDIA3_API_KEY }}
          NVIDIA4_API_KEY: ${{ secrets.NVIDIA4_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
          GEM_MODELS: "gemini-3.8-flash"
          NVIDIA_MODELS: "nvidia/nemotron-3-ultra-550b-a55b,nvidia/nemotron-3-super-120b-a12b,z-ai/glm-5.3,z-ai/glm-5.3-flash"
          AMD_MODEL: "DeepSeek-V4-Flash"
          AMD_FALLBACK_MODELS: "Qwen3.8-Flash-Next"
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER2_API_KEY: ${{ secrets.OPENROUTER2_API_KEY }}
          OR_MODELS: "nvidia/nemotron-3-ultra-550b-a55b:free"
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          ORCAROUTER2_API_KEY: ${{ secrets.ORCAROUTER2_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ2_API_KEY: ${{ secrets.GROQ2_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL2_API_KEY: ${{ secrets.DEEPL2_API_KEY }}
          ORCA_MODELS: "tencent/hy4-preview-free,deepseek/deepseek-v4-flash-free,z-ai/glm-5.3-flash-free"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODELS: "space-bunny-free,ling-3.1-flash-free,cat-jam-free"
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
        run: python -u i18n.py --saglayici-test

      # 2026-10-13: canli kosum yeni_ceviri=12 / reddedilen_ceviri=224 verdi.
      # Saglayici "OK" donse bile ceviri kalite kontrolunden gecemiyordu.
      # Bu adim HER saglayicidan ham cevabi tek tek yazip red sebebini gosterir
      # (kimlik ceviri mi, bos JSON mu, Turkce sizintisi mi).
      - name: Ceviri kalitesi teshisi (tek istek/uc)
        if: ${{ inputs.test }}
        env:
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA2_API_KEY: ${{ secrets.NVIDIA2_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER2_API_KEY: ${{ secrets.OPENROUTER2_API_KEY }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          ORCAROUTER2_API_KEY: ${{ secrets.ORCAROUTER2_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ2_API_KEY: ${{ secrets.GROQ2_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL2_API_KEY: ${{ secrets.DEEPL2_API_KEY }}
        run: |
          python -u i18n_kalite_testi.py
          echo "::group::NVIDIA model hiz probu (hangi model kac sn suruyor?)"
          python -u nvidia_hiz_testi.py || echo "::warning::NVIDIA hiz probu tamamlanamadi"
          echo "::endgroup::"

      - name: Cok dilli sayfalari uret
        if: ${{ !inputs.test }}
        env:
          # 20 istek/dk sinirinin altinda kal (3.5 sn -> ~17/dk)
          I18N_ARALIK: "3.5"
          I18N_ARALIK_ZAI: "0.15"
          I18N_PENCERE: "20"
          # NVIDIA soguk baslangicta ~2 dk surebiliyor (kullanici arayuzde dogruladi):
          # 60 sn'lik global deger cevap gelmeden istegi iptal ediyordu. Artik
          # yavas uclar (NVIDIA/NVIDIA2) kendi longer suresine sahip.
          I18N_TIMEOUT: "30"
          I18N_YAVAS_UC: "NVIDIA,NVIDIA2"
          I18N_YAVAS_TIMEOUT: "200"
          I18N_SURE_SINIRI_DK: "60"
          # Sira: DeepSeek (birincil, daha guclu) -> Qwen (yedek). Kapasite doluysa 20 sn icinde devreder.
          # Z.AI (GLM) â€” kullanicinin kayitli anahtari; ceviride birincil
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: "glm-5.3-flash"
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA2_API_KEY: ${{ secrets.NVIDIA2_API_KEY }}
          NVIDIA3_API_KEY: ${{ secrets.NVIDIA3_API_KEY }}
          NVIDIA4_API_KEY: ${{ secrets.NVIDIA4_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
          GEM_MODELS: "gemini-3.8-flash"
          NVIDIA_MODELS: "nvidia/nemotron-3-ultra-550b-a55b,nvidia/nemotron-3-super-120b-a12b,z-ai/glm-5.3,z-ai/glm-5.3-flash"
          AMD_MODEL: "DeepSeek-V4-Flash"
          AMD_FALLBACK_MODELS: "Qwen3.8-Flash-Next"
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER2_API_KEY: ${{ secrets.OPENROUTER2_API_KEY }}
          OR_MODELS: "nvidia/nemotron-3-ultra-550b-a55b:free"
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          ORCAROUTER2_API_KEY: ${{ secrets.ORCAROUTER2_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ2_API_KEY: ${{ secrets.GROQ2_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL2_API_KEY: ${{ secrets.DEEPL2_API_KEY }}
          ORCA_MODELS: "tencent/hy4-preview-free,deepseek/deepseek-v4-flash-free,z-ai/glm-5.3-flash-free"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODELS: "space-bunny-free,ling-3.1-flash-free,cat-jam-free"
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
        run: python -u i18n.py --diller en,de,ru,zh --provider ${{ inputs.provider || 'llm' }} --sitemap

      - name: Degisiklikleri depoya kaydet (hata olsa bile)
        if: always()
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Kaydedilecek degisiklik yok."
          else
            git commit -m "Cok dilli sayfalar guncellendi (ceviri kosusu) [CI Skip]"
            git pull --rebase --quiet -X theirs origin main || true
            git push
          fi
      # 2026-10-07: GitHub sabah yuk penceresinde schedule kosularini
      # dusurdugu icin yayin nobetcisi gun ici bu kadar guvenilir kaynakla
      # uyandirilir (nobetci kendi zincirini kurar; bu yalnizca baslangic).
      # 2026-10-09: pencere 07:00'den itibaren â€” gunluk cronu (07:17 TSI)
      # sabah dusme penceresinde yine dusecegi icin telafi bir saat erken.
      - name: Nobetci zincirini uyandir (hafta ici 07-16 TSI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GUN=$(TZ=Europe/Istanbul date +%u)
          SAAT=$(TZ=Europe/Istanbul date +%H)
          if [ "$GUN" -le 5 ] && [ "$SAAT" -ge 7 ] && [ "$SAAT" -le 15 ]; then
            gh workflow run yayin-nobetci.yml --repo "$GITHUB_REPOSITORY" --ref main               && echo "Nobetci zinciri tetiklendi." || echo "Tetikleme atlandi."
          else
            echo "Zincir baslatma penceresi disi (TSI $SAAT, gun $GUN)."
          fi
