name: Cok Dilli Sayfa Guncelleme

# Ceviri ayri bir kosuda yapilir; gunluk rapor kosusu ceviri yuzunden uzamaz/iptal olmaz.
# AMD: RPM limiti 20/dk ve buyuk modeller %100 kapasitede -> istekler arasi 3.5 sn, idle model birincil.

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Sadece saglayici testi calistir (ceviri yapmaz)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: i18n
  cancel-in-progress: false

jobs:
  cevir:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Saglayici testi (kotasiz)
        if: ${{ inputs.test }}
        env:
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          AMD_MODEL: "Qwen3.8-Flash-Next"
          AMD_FALLBACK_MODELS: "DeepSeek-V4-Flash"
          ALT_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python i18n.py --saglayici-test

      - name: Cok dilli sayfalari uret
        if: ${{ !inputs.test }}
        env:
          # 20 istek/dk sinirinin altinda kal (3.5 sn -> ~17/dk)
          I18N_ARALIK: "3.5"
          I18N_PENCERE: "40"
          I18N_TIMEOUT: "30"
          I18N_SURE_SINIRI_DK: "45"
          # Buyuk modeller %100 kapasitede (kuyruk -> timeout): ceviride idle model birincil
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          AMD_MODEL: "Qwen3.8-Flash-Next"
          AMD_FALLBACK_MODELS: "DeepSeek-V4-Flash"
          ALT_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OR_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python i18n.py --diller en,de,ru,zh --provider llm --sitemap

      - name: Degisiklikleri depoya kaydet
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Kaydedilecek degisiklik yok."
          else
            git commit -m "Cok dilli sayfalar guncellendi (ceviri kosusu)"
            git pull --rebase --quiet -X theirs origin main || true
            git push
          fi
