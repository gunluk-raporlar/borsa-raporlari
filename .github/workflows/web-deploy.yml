name: Web (Next.js) Deploy

# web/ altindaki Next.js uygulamasini Cloudflare Pages'e deploy eder.
# Hedef: AYRI bir Pages projesi (borsa-raporlari-web.pages.dev) — mevcut
# statik sitemiz (borsa-raporlari.pages.dev) bu workflow'dan ETKILENMEZ.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bagimliliklar
        run: npm ci

      - name: Vercel build ayarlari (linksiz derleme)
        run: |
          mkdir -p .vercel
          echo '{"framework":"nextjs"}' > .vercel/project.json

      - name: Vercel + next-on-pages build
        run: |
          npx vercel build --prod
          npx next-on-pages --skip-build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Pages projesi yoksa olustur
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages project create borsa-raporlari-web --production-branch=main \
            || echo "Proje zaten var, devam ediliyor."

      - name: Pages environment secret'larini guncelle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -e
          if [ -n "$SUPABASE_URL" ]; then
            printf '%s' "$SUPABASE_URL" | npx wrangler@3 pages secret put SUPABASE_URL --project-name=borsa-raporlari-web
          fi
          if [ -n "$SUPABASE_SERVICE_KEY" ]; then
            printf '%s' "$SUPABASE_SERVICE_KEY" | npx wrangler@3 pages secret put SUPABASE_SERVICE_KEY --project-name=borsa-raporlari-web
          fi
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler@3 pages secret put CF_API_KEY --project-name=borsa-raporlari-web
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler@3 pages secret put CF_ACCOUNT_ID --project-name=borsa-raporlari-web

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy .vercel/output/static --project-name=borsa-raporlari-web --branch=main --commit-dirty=true
