name: EVDS Sağlık Kontrolü
# dispatch-only: pin'li 5 makro serisini gerçek anahtarla canlı çeker,
# kayıtları yazdırır. Eksik kayıt varsa kırmızı (exit 1).
# EVDS anahtarı yalnızca Actions secret'ta olduğu için canlı doğrulamanın
# tek yolu bu iş.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saglik:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Pin'li gostergeleri canli cek ve yazdir
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          python3 -u - <<'PY'
          import json, logging, sys, zoneinfo
          from datetime import datetime

          logging.basicConfig(level=logging.INFO)
          import evds_veri

          bugun = datetime.now(
              zoneinfo.ZoneInfo("Europe/Istanbul")).date().isoformat()
          liste = []
          n = evds_veri.gostergeleri_ekle(liste, bugun)
          adet = len(evds_veri.MACRO_HEDEFLERI)
          print(f"TARIH={bugun} HEDEF={adet} EKLENEN={n}")
          for k in liste:
              print(" | ", json.dumps(k, ensure_ascii=False))
          sys.exit(0 if n == adet else 1)
          PY
