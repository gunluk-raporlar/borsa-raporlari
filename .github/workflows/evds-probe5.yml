name: EVDS Ucu Denetimi 5
# Gecici: (1) faiz/getiri/yield iceren TUM taze gruplar, (2) pydibs'te
# ISIN disi "2/10 yillik getiri" ozet serisi var mi, (3) aday gruplarin
# 2/10 yil serileri.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: EVDS 5. denetim
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from datetime import date, datetime

          K = os.environ.get("EVDS_API_KEY", "")
          KOK = "https://evds3.tcmb.gov.tr/igmevdsms-dis/"

          def istek(yol):
              req = urllib.request.Request(KOK + yol, headers={"key": K})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return None, str(e).encode()

          def duz(t):
              s = str(t or "").casefold()
              for a, b in (("ı","i"),("i̇","i"),("ş","s"),("ğ","g"),("ü","u"),
                           ("ö","o"),("ç","c"),("â","a"),("î","i"),("û","u")):
                  s = s.replace(a, b)
              return s

          def son_tarih(k):
              try:
                  return datetime.strptime(str(k)[:10], "%d-%m-%Y").date()
              except ValueError:
                  return date.min

          # 1) faiz/getiri/yield/hazine/treasury/bono iceren TUM taze gruplar
          s, g = istek("datagroups/mode=0&code=&type=json")
          gruplar = [gr for gr in json.loads(g) if isinstance(gr, dict) and gr.get("DATAGROUP_CODE")]
          esik = date(2025, 6, 1)
          desen = r"faiz|interest|getiri|yield|hazine|treasury|bono"
          bul = [gr for gr in gruplar if re.search(
              desen, duz(gr.get("DATAGROUP_NAME")) + " " + duz(gr.get("DATAGROUP_NAME_ENG")))]
          bul = [gr for gr in bul if son_tarih(gr.get("END_DATE")) >= esik]
          bul.sort(key=lambda gr: son_tarih(gr.get("END_DATE")), reverse=True)
          print("FAIZ-GRUP |", len(bul))
          for gr in bul:
              print("G5 |", gr["DATAGROUP_CODE"], "|",
                    str(gr.get("DATAGROUP_NAME") or "")[:66], "|",
                    gr.get("END_DATE"), "| FREQ", gr.get("FREQUENCY"))

          # 2) pydibs: ISIN disi ozet seri arayisi (2/10 yil, ortalama, toplam)
          s, g = istek("serieList/type=json&code=bie_pydibs")
          if s == 200:
              seriler = [se for se in json.loads(g) if isinstance(se, dict)]
              print("PYDIBS | toplam", len(seriler))
              ozet = [se for se in seriler if re.search(
                  r"(?<!\d)(2|5|10|20)\s*yil|ortalama|toplam|gosterge|maturity bucket",
                  duz(se.get("SERIE_NAME")) + " " + duz(se.get("SERIE_NAME_ENG")))]
              print("PYDIBS-OZET |", len(ozet))
              for se in ozet[:20]:
                  print("P5 |", se.get("SERIE_CODE"), "|",
                        str(se.get("SERIE_NAME") or se.get("SERIE_NAME_ENG"))[:70],
                        "|", se.get("END_DATE"), "|", se.get("FREQUENCY_STR"))
          else:
              print("PYDIBS | HATA", s)

          # 3) aday gruplarin 2/10 yil serileri (faiz listesinden secilenler)
          aday_kodlar = [gr["DATAGROUP_CODE"] for gr in bul
                         if re.search(r"faiz|interest|getiri|yield",
                                      duz(gr.get("DATAGROUP_NAME"))
                                      + " " + duz(gr.get("DATAGROUP_NAME_ENG")))][:8]
          for kod in aday_kodlar:
              s, g = istek(f"serieList/type=json&code={kod}")
              if s != 200:
                  continue
              seriler = [se for se in json.loads(g) if isinstance(se, dict)]
              uygun = [se for se in seriler if re.search(
                  r"(?<!\d)(2|10)\s*(yil|year)|iki yil|on yil",
                  duz(se.get("SERIE_NAME")) + " " + duz(se.get("SERIE_NAME_ENG")))]
              uygun = [se for se in uygun if son_tarih(se.get("END_DATE")) >= esik]
              for se in uygun[:6]:
                  print("S5 |", kod, "|", se.get("SERIE_CODE"), "|",
                        str(se.get("SERIE_NAME") or se.get("SERIE_NAME_ENG"))[:70],
                        "|", se.get("END_DATE"), "|", se.get("FREQUENCY_STR"))
          PY
