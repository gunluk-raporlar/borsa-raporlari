name: CF Ayar Kontrol (tek seferlik)
# robot sayfasinin canli capasini dogrular: tam menu + seritler + arama var mi?
on:
  workflow_dispatch:
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Canli sayfa capasi
        run: |
          HTML=$(curl -sL "https://borsa-raporlari.pages.dev/robot")
          echo "menu ogesi sayisi: $(echo "$HTML" | grep -oE '<nav><a href="[^"]*"' | wc -l)"
          for ip in "Muhasebe Terimleri" "ticker-bant2" "live-clock-weather" "site-arama-giris" "robot-canli" "Bugün"; do
            say=$(echo "$HTML" | grep -cF "$ip" || true)
            echo "$ip: $say"
          done
          echo "style.css linki: $(echo "$HTML" | grep -c 'href="style.css"')"
          echo "== /api/fiyatlar durumu =="
          curl -s -o /dev/null -w "%{http_code}\n" "https://borsa-raporlari.pages.dev/api/fiyatlar"
          echo "== /api/robot durumu =="
          curl -s -o /dev/null -w "%{http_code}\n" "https://borsa-raporlari.pages.dev/api/robot"
