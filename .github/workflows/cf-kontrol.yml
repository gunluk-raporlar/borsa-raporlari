name: CF Ayar Kontrol (tek seferlik)
# Pages projesinin build ayarlarini okur — sirgala degil, workflow_dispatch ile
# elle calistirilir. Sadece guvenli olmayan yapisal bayraklar yazdirilir;
# token ve deployment_configs (env degerleri) loglara asla yazilmaz (repo public).
on:
  workflow_dispatch:
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages proje ayarlarini oku
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gunluk-raporlar" \
            | jq '{basari: .success,
                   build_config: (.result.build_config // {}),
                   source_config: (.result.source.config // {})}'
