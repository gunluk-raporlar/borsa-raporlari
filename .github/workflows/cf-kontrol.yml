name: CF Ayar Kontrol (tek seferlik)
# Pages proje semasini okur — SADECE anahtar adlari (degerler degil);
# token ve env degerleri loglara asla yazilmaz (repo public).
on:
  workflow_dispatch:
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Proje anahtarlari
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gunluk-raporlar" \
            | jq '{proje_anahtarlari: (.result | keys),
                   build_config_anahtarlari: (.result.build_config | keys),
                   deployment_config_anahtarlari: (.result.deployment_configs // {} | keys),
                   deployment_preview_anahtarlari: (.result.deployment_configs.preview // {} | keys),
                   deployment_production_anahtarlari: (.result.deployment_configs.production // {} | keys)}'
