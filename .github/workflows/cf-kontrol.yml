name: CF Ayar Kontrol (tek seferlik)
# Pages preview deploy'larini kapatir + son durumu okur.
# Sadece yapisal bayraklar yazdirilir; token ve deployment_configs (env
# degerleri) loglara asla yazilmaz (repo public).
on:
  workflow_dispatch:
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preview deploy'lari kapat (PATCH)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -X PATCH -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"build_config":{"preview_deployments_enabled":false}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gunluk-raporlar" \
            | jq '{patch_basari: .success, patch_hata: (.errors // [] | map(.message))}'
      - name: Son durumu oku
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gunluk-raporlar" \
            | jq '{basari: .success,
                   preview_deployments: (.result.build_config.preview_deployments_enabled // "alan-yok (varsayilan: acik)"),
                   otomatik_deploy: (.result.source.config.deployments_enabled // "bilinmiyor"),
                   production_branch: (.result.source.config.production_branch // "bilinmiyor")}'
