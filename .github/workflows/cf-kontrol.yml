name: CF Ayar Kontrol (tek seferlik)
# Canli robot sayfasinda JS bozukluguna yol acan cift-suslu parantez kaldi mi?
on:
  workflow_dispatch:
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Canli sayfa {{ kontrolu ve islem kaydi
        run: |
          HTML=$(curl -sL "https://borsa-raporlari.pages.dev/robot")
          echo "cift-suslu sayisi: $(echo "$HTML" | grep -c '{{' || true)"
          echo "updateClock temiz mi: $(echo "$HTML" | grep -c 'function updateClock() {' || true)"
          echo "islem kaydi (VAKBN AL): $(echo "$HTML" | grep -cF 'VAKBN' || true)"
          echo "pozisyon tablosu (BIMAS): $(echo "$HTML" | grep -cF 'BIMAS' || true)"
