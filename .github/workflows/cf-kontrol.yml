name: CF Ayar Kontrol (tek seferlik)
# robot sayfasinin /robot vs /robot.html HTTP davranisini kontrol eder.
on:
  workflow_dispatch:
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: URL davranislari
        run: |
          for u in "https://borsa-raporlari.pages.dev/robot" "https://borsa-raporlari.pages.dev/robot/" "https://borsa-raporlari.pages.dev/robot.html"; do
            echo "== $u =="
            curl -s -o /dev/null -w "durum: %{http_code} | yonlendirme: %{redirect_url}\n" "$u"
          done
          echo "== /robot icindekiden ornek =="
          curl -sL "https://borsa-raporlari.pages.dev/robot" | grep -oE '<link rel="stylesheet"[^>]*>|<nav>' | head -3
          echo "== /style.css durumu =="
          curl -s -o /dev/null -w "durum: %{http_code}\n" "https://borsa-raporlari.pages.dev/style.css"
