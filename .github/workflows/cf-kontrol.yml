name: CF Ayar Kontrol (tek seferlik)
# Pages projesinin build ayarlarini okur — sirgala degil, workflow_dispatch ile
# elle calistirilir. Sadece GUVENLI OLMAYAN ozellik bayraklarini yazdirir;
# token ve tam proje JSON'i loglara asla yazilmaz (repo public).
on:
  workflow_dispatch:
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages proje ayarlarini oku
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gunluk-raporlar" \
            | jq '{basari: .success,
                   hata: (.errors // [] | map(.message)),
                   preview_deployments: (.result.build_config.preview_deployments_enabled // "bilinmiyor"),
                   kaynak_bagli: (.result.source.type // "yok"),
                   otomatik_deploy: (.result.source.config.deployments_enabled // "bilinmiyor"),
                   production_deploy: (.result.source.config.production_deployments_enabled // "bilinmiyor"),
                   production_branch: (.result.source.config.production_branch // "bilinmiyor")}'
