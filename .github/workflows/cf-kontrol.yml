name: CF Ayar Kontrol (tek seferlik)
# Ana sayfa + ornek sayfalarda robot menu linkini ve robot.html'i dogrular.
on:
  workflow_dispatch:
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Menu linki ve sayfa durumu
        run: |
          echo "== ana sayfada robot linki =="
          curl -sL "https://borsa-raporlari.pages.dev/" | grep -oE 'href="robot.html"[^>]*>[^<]*' | head -2
          echo "== teknik-analiz sayfasinda =="
          curl -sL "https://borsa-raporlari.pages.dev/teknik-analiz.html" | grep -oE 'href="robot.html"' | head -1
          echo "== hisse sayfasinda (goreli yol) =="
          curl -sL "https://borsa-raporlari.pages.dev/hisse/ASELS.html" | grep -oE 'href="\.\./robot\.html"' | head -1
          echo "== robot.html durumu =="
          curl -s -o /dev/null -w "%{http_code}\n" -L "https://borsa-raporlari.pages.dev/robot.html"
