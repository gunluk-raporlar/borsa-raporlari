name: Render Keep-Alive
on:
  schedule:
    - cron: '*/15 * * * *'   # 15 dakikada bir ping — Render free tier uykuya dolmasin
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Siteyi ping'le (uykumayi engelle)
        run: |
          kod=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://borsa-raporlari.onrender.com/)
          echo "HTTP $kod"
          # 2xx/3xx basari sayilir; uyuyan site ilk istekte 502/timeout verebilir,
          # bu yuzden 5 sn sonra bir kez daha denenir.
          if [ "$kod" -lt 200 ] || [ "$kod" -ge 400 ]; then
            sleep 5
            kod2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://borsa-raporlari.onrender.com/)
            echo "Tekar denendi: HTTP $kod2"
            if [ "$kod2" -ge 200 ] && [ "$kod2" -lt 400 ]; then exit 0; fi
            exit 1
          fi
