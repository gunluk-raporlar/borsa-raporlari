name: Site Yayini (gunluk publish)
# Tum icerik botlari commit'lerini [CI Skip] ile atar (build tetiklemez).
# Bu workflow gunde 2 kez bos bir commit atarak Cloudflare Pages build'ini
# tetikler: o ana kadar biriken tum guncellemeler siteye yayinlanir.
# Aylik tuketim ~60 build (500 limitinin ~%12'si).
on:
  schedule:
    # 2026-10-10: dakika-30 cronlari da ayni sekilde sessiz dustugu icin
    # tek-saat-disi dakikalara tasindi (nobetci de publish eksigini
    # yakalayip bu akisi tetikliyor).
    - cron: '37 7 * * *'   # 10:37 Turkiye saati — oglen yayini
    - cron: '43 16 * * *'  # 19:43 Turkiye saati — aksam yayini (robot kapanisi 19:15'ten sonra)
  workflow_dispatch:
  # Sabah gunluk raporu bittigi an siteye gitsin; 10:30'u beklemesin
  # (2026-09-29: rapor 08:52'de repodaydi, site 10:30'a kadar eski kaldi).
  # Basarisiz kosular yayini tetiklemez (job kosulunda suzulur).
  # Aylik tuketim ~60 -> ~83 build (500 limitinin ~%17'si).
  workflow_run:
    workflows: ["Gunluk BIST 30 Raporu"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: site-yayini
  cancel-in-progress: false
jobs:
  yayinla:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Yayin commit'i (Cloudflare Pages build'ini tetikler)
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git pull --rebase -X theirs origin main
          # Dil secici baglantilari (2026-10-30): bolum index'leri ve tarihli
          # arsiv sayfalarindaki eski menuler yayin commit'i icinde tazelenir
          # (ayni sayfanin cevirisi yoksa bolum hub'ina duser, ana sayfaya
          # degil). Fail-open: betik basarisizsa yayin eskisi gibi devam eder.
          python3 dil_baglantilari_tazele.py . || echo "UYARI: dil menusu tazeleme atlandi"
          # Ic baglanti guzel-URL temizligi (2026-10-22, GSC 'Yonlendirmeli
          # sayfa'): deploy kok dizininden yapildigi icin her yayindan once
          # repo agaci temizlenir; degisen sayfalar yayin commit'ine girer.
          # Fail-open: betik basarisizsa yayin eskisi gibi devam eder.
          python3 baglanti_guzellestir.py . || echo "UYARI: baglanti temizligi atlandi"
          git add -A
          git commit --allow-empty -m "Site yayini (ic baglanti guzel-URL temizligi dahil)"
          git push origin main
