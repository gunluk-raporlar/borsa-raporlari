name: Site Yayini (gunluk publish)
# Tum icerik botlari commit'lerini [CI Skip] ile atar (build tetiklemez).
# Bu workflow gunde 4 planli slotta bos bir commit atarak Cloudflare Pages
# build'ini tetikler: o ana kadar biriken tum guncellemeler siteye yayinlanir.
# 2026-10-31: GitHub planli kosulari sik sik SESSIZCE dustugu icin (bugun
# sabah 10:37 slotu + nobetcinin 6 hafta sonu penceresinin tamami dustu)
# slot sayisi 2 -> 4 cikarildi; en az biri yuk penceresi (08-12 UTC)
# disinda kaliyor. Yeni icerik yoksa asagidaki kapi build harcatmaz.
# Aylik tuketim ~120 build (500 limitinin ~%24'u).
on:
  schedule:
    # 2026-10-10: dakika-30 cronlari da ayni sekilde sessiz dustugu icin
    # tek-saat-disi dakikalara tasindi (nobetci de publish eksigini
    # yakalayip bu akisi tetikliyor).
    - cron: '37 3 * * *'   # 06:37 Turkiye saati — sabah yayini (gece i18n cikisi)
    - cron: '37 7 * * *'   # 10:37 Turkiye saati — oglen yayini
    - cron: '37 13 * * *'  # 16:37 Turkiye saati — ikindi yayini (hafta sonu icerigi aksama kalmadan duser)
    - cron: '43 16 * * *'  # 19:43 Turkiye saati — aksam yayini (robot kapanisi 19:15'ten sonra)
  workflow_dispatch:
    inputs:
      dogrulamayi_atla:
        description: 'Veri doğrulama kapısını atla (istisnai durumlar için)'
        type: boolean
        default: false
  # Sabah gunluk raporu bittigi an siteye gitsin; 10:30'u beklemesin
  # (2026-09-29: rapor 08:52'de repodaydi, site 10:30'a kadar eski kaldi).
  # Basarisiz kosular yayini tetiklemez (job kosulunda suzulur).
  # Aylik tuketim 4 slotla ~120 build (500 limitinin ~%24'u).
  workflow_run:
    # 2026-11-12: "Cok Dilli Sayfa Guncelleme" eklendi — ceviri commit'leri
    # [CI Skip] tasidigindan CF build tetiklemez; ceviri BITINCE yayin hemen
    # kalksin (diger slotlara kalmasin). Bos ceviri kosusunda publish yine
    # "yeni icerik yok" kapisiyla atlanir.
    workflows: ["Gunluk BIST 30 Raporu", "Cok Dilli Sayfa Guncelleme"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: site-yayini
  cancel-in-progress: false
jobs:
  yayinla:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Ana sayfa tazeleme icin kutuphaneler
        # Ana sayfa uretimi bot.py'yi import eder; bot.py modul duzeyinde
        # pandas/openai/langgraph/feedparser/markdown istiyor (diger importlar
        # stdlib). Tam requirements.txt kurmak yfinance/borsapy/edge-tts gibi
        # yayinla ilgisiz agir paketleri de indirirdi. Kurulum dusse bile
        # yayin DURMAZ: asagidaki tazeleme adimi fail-open.
        continue-on-error: true
        timeout-minutes: 4
        run: pip install -q openai pandas langgraph feedparser markdown
      - name: Yayin commit'i (Cloudflare Pages build'ini tetikler)
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git pull --rebase -X theirs origin main
          # Yeni icerik kapisi (2026-10-31): HEAD zaten bir yayin commit'i ise
          # depoda yayinlanmayi bekleyen sey yoktur; bos commit + CF build
          # harcanmaz (4 slotlu tasarımda bosta build yapmamak icin sart).
          HEAD_KONU="$(git log -1 --pretty=%s)"
          case "$HEAD_KONU" in
            "Site yayini"*)
              echo "Yeni icerik yok (HEAD yayin commit'i) — yayin atlandi."
              exit 0;;
          esac
          # Veri doğrulama kapisi (2026-11-08): yayin cikmadan once makine-okunur
          # JSON'larin yapisi denetlenir (ticker/piyasa-serit/portfolio/karne).
          # Bloklayici: hata varsa commit/push yapilmaz, CF build harcanmaz.
          # Kapinin git pull'dan SONRA ve degisiklik betiklerinden ONCE calismasi,
          # az once pushlanan taze veriyi dogrulamasini saglar.
          if [ "${{ inputs.dogrulamayi_atla }}" = "true" ]; then
            echo "Dogrulama atlandi (workflow_dispatch bayragi)."
          else
            python3 pipeline/veri_dogrula.py .
          fi
          # Ana sayfa tazeleme (2026-11-14): index.html'i TAZE agactan yeniden
          # uretir. Icerik botlari kendi ana sayfa tazelemelerini yapar ama
          # commit adimindaki "git pull --rebase -X ours" cakisan index.html'de
          # origin'i tutar ve o tazelemeyi SESSIZCE atar (14.11: egitim kosusu
          # 07:49'da index.html'i degistirdi, gundem kosusu 07:50'de ayni dosyayi
          # tazeledi; rebase gundem kartini dusurdu, hafta sonu sayisi anasayfada
          # hic gorunmedi). Yayin kapisinda tazelemek tum icerik turlerini
          # (gunluk/derin/makro/hafta sonu/okul) tek noktadan kapatir.
          # Fail-open: betik dusse yayin eskisi gibi devam eder.
          python3 anasayfa_tazele.py || echo "UYARI: ana sayfa tazeleme atlandi"
          # Dil secici baglantilari (2026-10-30): bolum index'leri ve tarihli
          # arsiv sayfalarindaki eski menuler yayin commit'i icinde tazelenir
          # (ayni sayfanin cevirisi yoksa bolum hub'ina duser, ana sayfaya
          # degil). Fail-open: betik basarisizsa yayin eskisi gibi devam eder.
          python3 dil_baglantilari_tazele.py . || echo "UYARI: dil menusu tazeleme atlandi"
          # Ic baglanti guzel-URL temizligi (2026-10-22, GSC 'Yonlendirmeli
          # sayfa'): deploy kok dizininden yapildigi icin her yayindan once
          # repo agaci temizlenir; degisen sayfalar yayin commit'ine girer.
          # Fail-open: betik basarisizsa yayin eskisi gibi devam eder.
          python3 baglanti_guzellestir.py . || echo "UYARI: baglanti temizligi atlandi"
          git add -A
          git commit --allow-empty -m "Site yayini (ic baglanti guzel-URL temizligi dahil)"
          git push origin main
