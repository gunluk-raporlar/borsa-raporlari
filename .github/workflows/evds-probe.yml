name: EVDS Ucu Denetimi
# Gecici: EVDS 400 hatasinin URL biciminden mi kaynaklandigini gercek
# anahtarla dener. Sonuc alindiktan sonra bu workflow silinebilir.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: URL varyantlarini dene
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error

          K = os.environ.get("EVDS_API_KEY", "")
          KOK = "https://evds3.tcmb.gov.tr/igmevdsms-dis/"
          print("anahtar tanimli:", bool(K), "uzunluk:", len(K))

          veri_sorgu = ("series=TP.DK.USD.A-TP.DK.EUR.A"
                        "&startDate=20-09-2026&endDate=24-09-2026"
                        "&type=json&frequency=1&formulas=&aggregationTypes=")
          varyantlar = [
              "categories/?type=json",
              "categories/type=json",
              "datagroups/?mode=0&code=&type=json",
              "datagroups/mode=0&code=&type=json",
              "datagroups/?type=json",
              "serieList/?type=json&code=bie_tfv",
              "serieList/type=json&code=bie_tfv",
              "?" + veri_sorgu,
              veri_sorgu,
          ]
          for v in varyantlar:
              req = urllib.request.Request(KOK + v, headers={"key": K})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      govde = r.read()[:110].decode("utf-8", "replace").replace("\n", " ")
                      print(f"{r.status} | {v[:70]} | {govde}")
              except urllib.error.HTTPError as e:
                  govde = e.read()[:110].decode("utf-8", "replace").replace("\n", " ")
                  print(f"{e.code} | {v[:70]} | {govde}")
              except Exception as e:
                  print(f"ERR | {v[:70]} | {type(e).__name__}: {e}")
          PY
