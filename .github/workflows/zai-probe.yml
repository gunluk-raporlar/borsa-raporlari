name: Z.ai Format Probe
# Geçici tanı testi: glm-5.3-flash'in thinking parametresini hangi
# biçimde kabul ettiğini bulur (1210 "cannot be disabled" gizemini çözer).
# Anahtar ASLA yazdırılmaz; yalnızca HTTP durum kodları ve yanıt özeti basılır.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Biçim yoklaması
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python -u zai_probe.py
