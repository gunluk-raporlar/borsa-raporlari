name: Z.ai Format Probe
# Geçici tanı testi: glm-5.3-flash'in thinking parametresini hangi
# biçimde kabul ettiğini bulur (1210 "cannot be disabled" gizemini çözer).
# Anahtar ASLA yazdırılmaz; yalnızca HTTP durum kodları ve yanıt özeti basılır.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Biçim yoklaması
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python -u - <<'PY'
import json, os, urllib.request

anahtar = os.environ["ZAI_API_KEY"]
url = "https://api.z.ai/api/paas/v4/chat/completions"

def dene(etiket, ek_alanlar):
    govde = {"model": "glm-5.3-flash",
             "messages": [{"role": "user", "content": "1+1 kac? sadece sayiyi yaz"}],
             "max_tokens": 512}
    govde.update(ek_alanlar)
    req = urllib.request.Request(url, data=json.dumps(govde).encode(),
        headers={"Authorization": f"Bearer {anahtar}", "Content-Type": "application/json"})
    try:
        with urllib.request.urlopen(req, timeout=90) as r:
            d = json.loads(r.read().decode())
        icerik = (d.get("choices") or [{}])[0].get("message", {}).get("content", "")
        kullanim = d.get("usage", {})
        print(f"[{etiket}] OK | cevap: {str(icerik)[:40]!r} | tokens: {kullanim}")
    except urllib.error.HTTPError as e:
        govde_txt = e.read().decode()[:160]
        print(f"[{etiket}] HTTP {e.code} | {govde_txt}")
    except Exception as e:
        print(f"[{etiket}] HATA: {type(e).__name__}: {str(e)[:100]}")

dene("A: param yok", {})
dene("B: obj low", {"thinking": {"type": "low"}})
dene("C: string low", {"thinking": "low"})
dene("D: reasoning_effort", {"reasoning_effort": "low"})
dene("E: obj enabled", {"thinking": {"type": "enabled"}})
PY
