name: Resmi Kanal Sağlık Kontrolü
# dispatch-only: AB (Eurostat/ECB) + ABD (BLS/FRED/BEA) pin'lerini gercek
# anahtarlarla canli ceker, degerleri ve tazelik kapagi kararini yazdirir.
# API anahtarlari ASLA yazdirilmaz (metinler ortak temizleyiciden gecer).
# Kirmizi cikis = beklendigi gibi calismayan pin var.
# BEA ITA "Indicator" kesfi de burada yapilir (cari denge kodu bulunana kadar
# o pin kasitli olarak atlanir ve kod bu ciktidan resmi_veri.CARI_GOSTERGE'e
# yazilir).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saglik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resmi pin'leri canli cek ve yazdir
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
        run: |
          python3 -u - <<'PY'
          import json, os, sys, zoneinfo
          from datetime import datetime

          import resmi_veri

          ANAHTARLAR = [os.environ.get(k) for k in
                        ("FRED_API_KEY", "BLS_API_KEY", "BEA_API_KEY",
                         "EVDS_API_KEY", "TUIK_API_KEY")]


          def temizle(metin):
              """Anahtarlari herhangi bir ciktidan siler (guvenlik kilidi)."""
              s = str(metin)
              for a in ANAHTARLAR:
                  if a and len(a) >= 6:
                      s = s.replace(a, "***")
              return s


          bugun = datetime.now(
              zoneinfo.ZoneInfo("Europe/Istanbul")).date().isoformat()
          print("TARIH=%s HEDEF=%d" % (bugun, len(resmi_veri.PINLER)))

          # TV snapshot'i varsa resmi degerle karsilastirilir (kim kazaniyor?).
          tv = {}
          try:
              with open("data/makro-snapshot.json", encoding="utf-8") as f:
                  ham = json.load(f)
              ulke = {"Euro Bölgesi": "EU", "ABD": "US"}
              for r in ham.get("records", []):
                  tv[(r["country_code"], r["indicator"])] = r
          except Exception as e:
              print("TV snapshot okunamadi:", temizle(e))

          # BEA ITA: Indicator dogru gorunuyor ama (Frequency, Year)
          # kombinasyonu yanlis olabilir; yanit 200 + bos Data donuyor.
          # Uc sey birlikte yazdirilir: gecerli parametre degerleri, ham
          # yanitin SEKLI (Data bazi yanitlarda liste degil dict geliyor;
          # d[0] o yuzden KeyError 0 veriyordu) ve dayanikli kombinasyon
          # taramasi; calisan kombinasyon _BEA_FREKANS'a yazilir.
          if os.environ.get("BEA_API_KEY") and resmi_veri.CARI_GOSTERGE:
              import urllib.parse
              bea_pin = next(p for p in resmi_veri.PINLER
                             if p.get("tip") == "bea")
              _anahtar = os.environ["BEA_API_KEY"]

              def _http(**ek):
                  p = {"UserID": _anahtar, "method": "GetData",
                       "datasetname": bea_pin.get("veri_seti", "ITA"),
                       "Indicator": resmi_veri.CARI_GOSTERGE,
                       "ResultFormat": "JSON"}
                  p.update(ek)
                  return json.loads(resmi_veri._istek(
                      resmi_veri.BEA_KOK + "?" + urllib.parse.urlencode(p),
                      anahtar=_anahtar, etiket="BEA-probe"))

              def _sekil(g):
                  """Yanit seklini yazar; Data dict gelirse ham halini de."""
                  bea = (g.get("BEAAPI") or {}) if isinstance(g, dict) else {}
                  res = (bea.get("Results") or {})
                  veri = res.get("Data")
                  print("BEA-SEKIL | ust=%s | Results=%s | Data=%s" % (
                      sorted(g.keys()) if isinstance(g, dict) else "?",
                      sorted(res.keys()), type(veri).__name__))
                  for h in (bea.get("Error"),
                            g.get("Error") if isinstance(g, dict) else None):
                      if h:
                          print("BEA-HATA | %s" % temizle(
                              json.dumps(h, ensure_ascii=False))[:300])
                  if isinstance(veri, dict) and veri:
                      print("BEA-DATA | %s" % temizle(
                          json.dumps(veri, ensure_ascii=False))[:400])
                  return veri

              # ITA'nin kabul ettigi Frequency/Year degerleri kesifle yazilir.
              for _p in ("Frequency", "Year"):
                  try:
                      sv = json.loads(resmi_veri._istek(
                          resmi_veri.BEA_KOK + "?" + urllib.parse.urlencode({
                              "UserID": _anahtar,
                              "method": "GetParameterValues",
                              "datasetname": "ITA", "ParameterName": _p,
                              "ResultFormat": "JSON"}),
                          anahtar=_anahtar, etiket="BEA-probe"))
                      pv = ((sv.get("BEAAPI") or {}).get("Results")
                            or {}).get("ParamValue")
                      if isinstance(pv, list):
                          ks = [str(x.get("Key")) for x in pv
                                if isinstance(x, dict)]
                          print("BEA-PARAM | %s | n=%d | ilk15=%s" % (
                              _p, len(ks), ",".join(ks[:15])))
                      else:
                          print("BEA-PARAM | %s | tip=%s | ham=%s" % (
                              _p, type(pv).__name__,
                              temizle(json.dumps(pv, ensure_ascii=False))
                              [:300]))
                  except Exception as e:
                      print("BEA-PARAM | %s | HATA %s" % (
                          _p, temizle(str(e))[:140]))

              def _dene(frek, yil):
                  try:
                      g = _http(Frequency=frek, Year=yil)
                  except Exception as e:
                      print("BEA-PROBE | F=%s Y=%s | HATA %s" % (
                          frek, yil, temizle(str(e))[:140]))
                      return 0, ""
                  veri = _sekil(g)
                  if isinstance(veri, list):
                      d = veri
                  elif isinstance(veri, dict) and (
                          "TimePeriod" in veri or "DataValue" in veri):
                      d = [veri]
                  else:
                      d = []
                  ilk = d[0] if d else {}
                  print("BEA-PROBE | F=%s Y=%s | n=%d | ilk=%s %s" % (
                      frek, yil, len(d), ilk.get("TimePeriod"),
                      ilk.get("DataValue")))
                  return len(d), (ilk.get("TimePeriod") or "")

              bulunan = None
              for _f in ("Q", "A", "M"):          # once Year=last (uretimdeki)
                  n, tp = _dene(_f, "last")
                  if n:
                      bulunan = (_f, "last", tp)
                      break
              if bulunan is None:                 # last bos donuyorsa yil dene
                  for _f in ("Q", "A", "M"):
                      for _y in ("2026", "2025"):
                          n, tp = _dene(_f, _y)
                          if n:
                              bulunan = (_f, _y, tp)
                              break
                      if bulunan:
                          break
              if bulunan:
                  resmi_veri._BEA_FREKANS[bea_pin["frekans"]] = bulunan[0]
                  print("BEA SECILEN = F=%s Y=%s ilk_donem=%s" % bulunan)
                  if bulunan[1] != "last":
                      print("BEA DKKAT: Year='last' calismiyor; "
                            "_bea'de Year='%s' olmali" % bulunan[1])
              else:
                  print("BEA PROBE: hicbir kombinasyonda veri gelmedi")

          sonuclar = resmi_veri.pin_kontrol(bugun)
          sorun = 0
          uyari = 0
          for s in sonuclar:
              satir = {k: v for k, v in s.items() if k != "hata"}
              print("PIN |", json.dumps(satir, ensure_ascii=False))
              if s.get("hata"):
                  print("     hata:", temizle(s["hata"])[:200])
              if s["durum"] == "ok":
                  k = (resmi_veri.ULKE_KOD[s["ulke"]], s["gosterge"])
                  t = tv.get(k)
                  if t is not None:
                      pin = next(p for p in resmi_veri.PINLER
                                 if p["gosterge"] == s["gosterge"]
                                 and p["ulke"] == s["ulke"])
                      gecer = resmi_veri._taze_mi(
                          s["donem"], t.get("period"), t.get("source_period"),
                          bugun, pin["frekans"])
                      print("     TV=%s (%s) | ezilecek=%s | kaynak: %s" % (
                          t.get("value"), t.get("source_period"),
                          "EVET" if gecer else "HAYIR (TV korunur)",
                          t.get("confirmed_by") or t.get("provenance")))
              if s["kaynak"] == "BEA":
                  # Indikator kesfi (durum: kesif/anahtar/bos) kasitli durum.
                  if s["durum"] == "ag":
                      uyari += 1
                  elif s["durum"] not in ("ok", "kesif", "anahtar", "bos"):
                      sorun += 1
              elif s["durum"] == "ag":
                  # Gecici ag hatasi (orn. Eurostat baglantisi kopmasi): isi
                  # kirmiziya cevirmez; yalnizca uyari olarak raporlanir.
                  uyari += 1
              elif s["durum"] != "ok":
                  sorun += 1

          if os.environ.get("BEA_API_KEY"):
              try:
                  liste = resmi_veri.bea_gostergeleri()
                  print("BEA ITA INDIKATOR SAYISI =", len(liste))
                  for it in liste:
                      print("BEA-IND |", it["kod"], "|", temizle(it["ad"]))
              except Exception as e:
                  print("BEA KESIF HATASI:", temizle(e)[:200])
          else:
              print("BEA_API_KEY yok; cari denge kesfi atlandi.")

          print("SONUC=%d SORUN=%d UYARI=%d" % (len(sonuclar), sorun, uyari))
          sys.exit(1 if sorun else 0)
          PY
