name: Makro Akşam Snapshot
on:
  schedule:
    # 18:05 Türkiye saati (UTC+3) = 15:05 UTC — kullanici karari (2026-10-06):
    # aksam 18:00 slotu. Eski 20:30 TSİ ayari GitHub gecikmelerinde gece
    # yarısına sarkiyor ve 18:00 kapısına takılıyordu; 18:05'te gece yarısına
    # ~6 saat pay kalır. 5 dakikalık pay, checkout+pip kurulumunun 18:00
    # kapısından ONCE bitmesi icin degil, kapının hemen uzerinde tutturulması
    # icin (kurulum ~1-2 dk surer, cekim 18:06-18:08 TSİ'de biter).
    - cron: '5 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: makro-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Canli makro verisini akşam snapshot'a yaz
        env:
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: python -u makro_snapshot.py
      - name: Snapshot degisikliklerini yayinla
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add data/makro.json data/makro-snapshot.json data/makro-gecmis data/enflasyon.json data/makro-rejim
          if [ -f data/evds-kodlar.json ]; then git add data/evds-kodlar.json; fi
          # Resmi veri tabani (EU + ABD + TUİK/EVDS onayli satirlar); ilk kosuda
          # dosya/dizin henuz olmayabilir, bu yuzden kosullu.
          if [ -f data/resmi-veri.json ]; then git add data/resmi-veri.json; fi
          if [ -d data/resmi-gecmis ]; then git add data/resmi-gecmis; fi
          if git diff --cached --quiet; then
            echo "Snapshot degismedi; commit atlandi."
            exit 0
          fi
          git commit -m "Aksam makro snapshot guncellemesi [CI Skip]"
          git pull --rebase -X theirs origin main
          git push origin main
