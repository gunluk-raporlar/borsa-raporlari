name: HS Test Env
on:
  schedule:
    - cron: '30 14 * * 0'
  workflow_dispatch:
    inputs:
      FORCE:
        description: 'test'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  gundem:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gundemi uret
        env:
          FORCE: ${{ inputs.FORCE }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python -u haftasonu.py
