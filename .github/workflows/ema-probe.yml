name: EMA Lightning Yoklamasi (gecici)
# Kullanici onerisi (2026-10-07): https://huggingface.co/canberkkkkkk/ema-lightning
# Turkce TTS (Apache 2.0, 8.6M parametre) — radyo hattinin edge-tts
# yedegi adayi. GPU'suz runner'da kurulum + hiz + ornek ses testi.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: torch (CPU surumu) kur
        # pip'in varsayilan torch'u CUDA paketi (~2 GB+); runner GPU'suz,
        # CPU wheel'i hem kucuk hem yeterli.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: ema-lightning kur
        run: pip install "ema-lightning==1.0.1" edge-tts
      - name: Yoklama (olcum + ornek ses)
        run: python -u ema_probe.py
      - name: Radyo yedegi entegrasyon testi (edge-tts simule kesinti)
        env:
          OPENCODE_API_KEY: deneme  # bot importu icin kukla anahtar (ag cagrisi yok)
        run: |
          python - <<'PY'
          import asyncio, os
          import edge_tts
          import radyo

          class Patlak:
              def __init__(self, *a, **k):
                  pass
              async def save(self, yol):
                  raise ConnectionError("simule edge-tts kesintisi")

          edge_tts.Communicate = Patlak  # fallback zorla tetiklenir
          os.makedirs("radyo/deneme", exist_ok=True)
          asyncio.run(radyo._replik_seslendir(
              "Merhaba, ben Mert. Yedek motor testi: BIST 30 günü yüzde 1,2 "
              "kazançla kapandı.", "MERT",
              "radyo/deneme/ema-yedek-test.mp3"))
          print("YEDEK TEST OK: radyo/deneme/ema-yedek-test.mp3")
          PY
      - name: Ornek sesleri repoya isle
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add radyo/deneme
          if ! git diff --cached --quiet; then
            git commit -m "EMA Lightning yoklama ornekleri [CI Skip]"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
      - name: Artifact yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-deneme
          path: radyo/deneme
