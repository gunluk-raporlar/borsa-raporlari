name: Islem Robotu (Paper Trading)
on:
  schedule:
    # 2026-11-07: cron slotları GitHub yükünde SESSİZCE düşüyor (6 Kasım'da
    # */15 deseninin 36 slotunun 35'i düştü; oturum içinde tek koşu 17:41'e
    # kaldı). Günün ilk koşuları için SAATLİK yedek cron (dakika-07, düşme
    # penceresinin dışında) + aşağıdaki kendini-tetikleme zinciri: oturum
    # içinde her koşu, sıradaki yarım-saat sınırına kadar uyuyup kendini
    # bir kez daha tetikler (~30 dk cadence). Emirler yalnızca BIST oturumunda
    # açılır: robot.py'deki islem_saati_mi kurali (22.10 kullanici karari)
    # hafta içi 10:00-18:00 TSİ dışında ve resmi tatillerde emir açmaz.
    - cron: '7 7-15 * * 1-5'
    # Kapanis kosusu: 16:15 UTC = 19:15 TR — gunun son ozkaynak noktasi/ozeti (emir acilmaz).
    - cron: '15 16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kutuphaneleri kur (yalnizca robotun kendi bagimliliklari)
        run: pip install pandas isyatirimhisse yfinance
      - name: Robotu calistir (paper trading)
        run: python -u robot.py
      - name: Degisiklikleri yayinla
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add robot.html data/robot/
          if git diff --cached --quiet; then
            echo "Degisiklik yok; commit atlanır."
            exit 0
          fi
          # Tum robot kosulari [CI Skip]: durum gite yazilir ama Cloudflare
          # Pages build tetiklenmez (aylik kota korunur). Siteyi publish.yml
          # gunde 4 kez yayinlar.
          git commit -m "Islem robotu guncellemesi [CI Skip]"
          git pull --rebase -X theirs origin main
          git push origin main
      # 2026-11-07 (kullanici onayi): oturum ici zincir — cron düşmelerine
      # karşı robot kendini tekrar tetikler. !cancelled(): robot/commit adımı
      # başarısız olsa bile zincir ölmesin; elle iptal ve job-timeout'ta
      # zincir saatlik cron yedeğine kalır.
      - name: Oturum icinde kendini tetikle (sonraki yarim saat)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          GUN=$(TZ=Europe/Istanbul date +%u)
          SAAT=$(TZ=Europe/Istanbul date +%H%M)
          if [ "$GUN" -ge 6 ] || [ "$SAAT" -lt 1000 ] || [ "$SAAT" -gt 1755 ]; then
            echo "Oturum disi (TSİ $SAAT) — zincir tetiklenmedi."
            exit 0
          fi
          BEKLEYEN=$(gh run list --workflow=robot.yml --status queued --limit 1 --json databaseId --jq 'length')
          if [ "${BEKLEYEN:-0}" -gt 0 ]; then
            echo "Bekleyen robot kosusu var — tetiklenmedi (kuyruk şişmesin)."
            exit 0
          fi
          UYKU=$(( 1800 - 10#$(TZ=Europe/Istanbul date +%M)*60 - 10#$(TZ=Europe/Istanbul date +%S) ))
          echo "Sonraki yarim-saat sinirina $UYKU sn uyunacak, sonra tetiklenecek."
          sleep "$UYKU"
          if [ "$(TZ=Europe/Istanbul date +%H%M)" -gt 1755 ]; then
            echo "Uyku sonrası oturum doldu — tetiklenmedi."
            exit 0
          fi
          gh workflow run robot.yml --ref main && echo "Zincir: sonraki kosu tetiklendi."
