name: Islem Robotu (Paper Trading)
on:
  schedule:
    # Hafta ici 07:00-15:45 UTC = 10:00-18:45 TSİ, her 15 dakikada bir canli fiyat
    # kontrolu. Emirler yalnizca BIST oturumunda acilir: robot.py'deki islem_saati_mi
    # kurali (22.10 kullanici karari) hafta ici 10:00-18:00 TSİ disinda ve resmi
    # tatillerde emir acmaz; 18:15+ kosulari takip/kapanis fiyati raporu icindir.
    - cron: '*/15 7-15 * * 1-5'
    # Kapanis kosusu: 16:15 UTC = 19:15 TR — gunun son ozkaynak noktasi/ozeti (emir acilmaz).
    - cron: '15 16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kutuphaneleri kur (yalnizca robotun kendi bagimliliklari)
        run: pip install pandas isyatirimhisse yfinance
      - name: Robotu calistir (paper trading)
        run: python -u robot.py
      - name: Degisiklikleri yayinla
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add robot.html data/robot/
          if git diff --cached --quiet; then
            echo "Degisiklik yok; commit atlanır."
            exit 0
          fi
          # Tum robot kosulari [CI Skip]: durum gite yazilir ama Cloudflare
          # Pages build tetiklenmez (aylik kota korunur). Siteyi publish.yml
          # gunde 2 kez (10:30 / 19:30 TR) yayinlar.
          git commit -m "Islem robotu guncellemesi [CI Skip]"
          git pull --rebase -X theirs origin main
          git push origin main
